name: Export Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-web:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Web Build
        run: |
          set -euo pipefail
          mkdir -p build/web
          docker run --rm \
            -v "$PWD":/project \
            -w /project \
            -e HOME=/root \
            barichello/godot-ci:4.7.2 \
            bash -lc '
              set -e
              echo "godot=$(command -v godot)"
              godot --version
              echo "templates:"
              ls -la /root/.local/share/godot/export_templates/ || true
              find /root/.local/share/godot/export_templates -name "web*" || true
              godot --headless --import --quit || true
              godot --headless --verbose --export-release "Web" /project/build/web/index.html
              ls -la /project/build/web
              test -f /project/build/web/index.html
              touch /project/build/web/.nojekyll
            '
          sudo chown -R "$(id -u):$(id -g)" build/web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          single-commit: true
