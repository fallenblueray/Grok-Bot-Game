name: Export Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-web:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-ci
            .godot-templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads-v2

      - name: Download Godot and web templates
        run: |
          set -euo pipefail
          mkdir -p .godot-ci .godot-templates
          if [ ! -x .godot-ci/godot ]; then
            curl -fL --retry 5 --retry-delay 2 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -o /tmp/godot.zip -d /tmp/godotbin
            mv /tmp/godotbin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 .godot-ci/godot
            chmod +x .godot-ci/godot
          fi
          if [ ! -f .godot-templates/web_nothreads_release.zip ]; then
            curl -fL --retry 5 --retry-delay 2 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            ls -lh /tmp/templates.tpz
            unzip -o /tmp/templates.tpz \
              "templates/web_nothreads_debug.zip" \
              "templates/web_nothreads_release.zip" \
              -d /tmp/tpz
            find /tmp/tpz -name 'web_nothreads_*.zip' -exec cp -v {} .godot-templates/ \;
          fi
          ls -lh .godot-templates
          test -f .godot-templates/web_nothreads_release.zip
          test -f .godot-templates/web_nothreads_debug.zip

      - name: Install templates
        run: |
          set -euo pipefail
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          cp -a .godot-templates/. "$TDIR/"
          ls -lh "$TDIR"
          test -f "$TDIR/web_nothreads_release.zip"
          test -f "$TDIR/web_nothreads_debug.zip"
          chmod +x .godot-ci/godot
          .godot-ci/godot --version

      - name: Web Build
        run: |
          set -euo pipefail
          mkdir -p build/web
          set +e
          .godot-ci/godot --headless --path "$PWD" --import --quit > godot-import.log 2>&1
          {
            echo "=== templates ==="
            ls -lh "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" || true
          } > godot-export.log
          .godot-ci/godot --headless --path "$PWD" --verbose --export-release "Web" "$PWD/build/web/index.html" >> godot-export.log 2>&1
          EC=$?
          set -e
          echo "export_exit=$EC"
          tail -n 120 godot-export.log
          if [ "$EC" -ne 0 ] || [ ! -f build/web/index.html ]; then
            echo "EXPORT FAILED"
            exit 1
          fi

      - name: Stage Three.js vertical slice
        run: |
          set -euo pipefail
          rm -rf build/web/three
          cp -R three-a build/web/three
          touch build/web/.nojekyll
          test -f build/web/three/index.html
          ls -la build/web/three
          ls -la build/web/.nojekyll

      - name: Post log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            for (const f of ['godot-import.log', 'godot-export.log']) {
              if (fs.existsSync(f)) {
                const t = fs.readFileSync(f, 'utf8');
                body += '## ' + f + '\n```\n' + t.slice(-12000) + '\n```\n';
              }
            }
            if (!body) body = '(no godot log files)';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI web export log ' + context.runNumber,
              body: body
            });

      - name: Deploy to GitHub Pages
        if: success()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          single-commit: true
